<style>
html, body {
    height: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
}

/* La navbar garde sa taille naturelle */
header {
    flex: 0 0 auto;
}

/* L'image remplit tout l'espace restant sous la navbar */
.home {
    flex: 1;
    width: 100%;
}

.home img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
}

</style>

<section class="home">
    <img src="img serveur accueil/serveurr.2.png" alt="base de données" loading="lazy">
</section>

<div id="footer"></div>

<script>
  fetch('footer.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('footer').innerHTML = data;
    });
</script>
