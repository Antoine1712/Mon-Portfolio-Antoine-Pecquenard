<style>
/* ---------- Layout global ---------- */
body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    margin: 0;
    background-color: #2c3e50;
}

main {
    flex: 1; /* permet au footer de rester en bas */
        margin : -30px; /* Ajuste la valeur */

}

/* ---------- Galerie ---------- */
.services-gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 4 colonnes sur desktop */
    gap: 20px;
    padding: 40px 20px;
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
}

.content-item {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    z-index: 1;
    cursor: pointer;
}

.content-item img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    display: block;
    transition: transform 0.5s ease;
}

/* ---------- Overlay ---------- */
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(4, 61, 118, 0.6);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.5s ease;
    text-align: center;
    padding: 10px;
}

.overlay h2 {
    font-size: 1.3rem;
    line-height: 1.4;
    font-weight: 600;
    text-shadow: 1px 1px 3px #000;
}

/* ---------- Hover effect desktop ---------- */
.content-item:hover .overlay {
    opacity: 1;
}
.content-item:hover img {
    transform: scale(1.08);
}

/* ---------- Active class pour mobile ---------- */
.content-item.active .overlay {
    opacity: 1;
}
.content-item.active img {
    transform: scale(1.08);
}

/* ---------- Responsive ---------- */
@media (max-width: 1024px) {
    .services-gallery {
        grid-template-columns: repeat(2, 1fr);
        padding: 30px 15px;
    }
    .overlay h2 {
        font-size: 1.1rem;
    }
    .content-item img {
        height: 220px;
    }
}

@media (max-width: 768px) {
    .services-gallery {
        grid-template-columns: 1fr;
        padding: 20px 10px;
    }
    .overlay h2 {
        font-size: 1rem;
    }
    .content-item img {
        height: 200px;
    }
}

/* ---------- Menu mobile au-dessus ---------- */
.navbar, .navbar-collapse { 
    position: relative;
    z-index: 10;
}
</style>

<script>
// --- Affiche le texte sur l'image quand on appuie sur mobile ---
if (window.matchMedia("(max-width: 768px)").matches) {
  const items = document.querySelectorAll('.content-item');

  items.forEach(item => {
    // Lorsqu'on appuie sur une image
    item.addEventListener('click', (e) => {
      // Si l'image n'est pas encore active, on empêche le lien de s'ouvrir
      if (!item.classList.contains('active')) {
        e.preventDefault();
        // Désactive les autres overlays
        items.forEach(i => i.classList.remove('active'));
        // Active celui sur lequel on a cliqué
        item.classList.add('active');

        // Cache automatiquement après 3 secondes
        setTimeout(() => {
          item.classList.remove('active');
        }, 3000);
      } 
      // Si l'image est déjà active → le deuxième appui ouvre le lien normalement
      else {
        item.classList.remove('active');
      }
    });
  });
}
</script>
