<div id="header"></div>

<script>
fetch('header.html')
  .then(response => response.text())
  .then(data => {
    document.getElementById('header').innerHTML = data;
  });
</script>

<section>
    <h1>MON CV</h1>
</section>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .pdf-container {
        width: 100%;
        max-width: 1100px;
        margin: 20px auto;
    }

    .pdf-container embed {
        width: 100%;
        height: 1400px; /* hauteur par défaut pour desktop */
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 1024px) {
        .pdf-container embed {
            height: 1200px;
        }
    }

    @media (max-width: 768px) {
        .pdf-container embed {
            height: 1000px;
        }
    }

    @media (max-width: 480px) {
        .pdf-container embed {
            height: 800px;
        }
    }

    section {
        padding-top: 10px; /* réduit l'espace au-dessus */
    }

    section h1 {
        text-align: center;
        margin-top: 1px;
        margin-bottom: 1px;
        color: #043d76;
    }
</style>

<div class="pdf-container">
  <embed src="pdf/CV Antoine Pecquenard Alternance.pdf" type="application/pdf">
</div>

<div id="footer"></div>

<script>
  fetch('footer.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('footer').innerHTML = data;
    });
</script>
